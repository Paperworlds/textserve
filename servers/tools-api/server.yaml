protocol: http
runtime: process
no_register: true
port: 10893
endpoint_path: /health
pid_file: /tmp/.mcp-tools-api.pid
native_cmd: uv
native_venv: "${HOME}/projects/personal/textserve/servers/tools-api/.venv"
native_args:
  - run
  - --directory
  - "${HOME}/projects/personal/textserve/servers/tools-api"
  - python
  - server.py
tags:
  - gateway
  - native
env:
  # Datadog
  - name: DD_API_KEY
    cache: "datadog/api-key"
  - name: DD_APP_KEY
    cache: "datadog/app-key"
  - name: DD_SITE
    value: "datadoghq.com"
  - name: DD_CRED_TTL_HOURS
    value: "4"
  # Snowflake
  - name: SNOWFLAKE_ACCOUNT
    cache: "snowflake/account"
  - name: SNOWFLAKE_USER
    cache: "snowflake/user"
  # Athena
  - name: ATHENA_REGION
    value: "ap-northeast-1"
  - name: ATHENA_ROLE
    value: "poweruser"
  - name: ATHENA_ROLE_OVERRIDES
    value: ""  # scrubbed; real value in local.yaml
  - name: ATHENA_REGION_OVERRIDES
    value: ""  # scrubbed; real value in local.yaml
  # PagerDuty
  - name: PAGERDUTY_TOKEN
    cache: "pagerduty/token"
  - name: PAGERDUTY_CRED_TTL_HOURS
    value: "4"
  # Sentry
  - name: SENTRY_TOKEN
    cache: "sentry/token"
  - name: SENTRY_ORG
    value: "your-sentry-org"  # scrubbed
  - name: SENTRY_CRED_TTL_HOURS
    value: "4"
  # Jenkins
  - name: JENKINS_URL
    value: "https://jenkins.internal.example"  # scrubbed; real value in ~/.local/paperworlds/textserve/local.yaml
  - name: JENKINS_USER
    value: "user@example.com"  # scrubbed
  - name: JENKINS_TOKEN
    value: ""
  - name: JENKINS_CRED_TTL_HOURS
    value: "4"
  # Gateway
  - name: TOOLS_API_PORT
    value: "10893"
health:
  endpoint: /health
  timeout: 15
